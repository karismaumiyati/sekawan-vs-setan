<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kepribadian: Sekawan vs Setan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas untuk simpan gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            overflow-x: hidden;
        }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .char-title {
            font-weight: 900;
            line-height: 0.8;
            text-transform: uppercase;
        }

        /*DOWLOAD FIXED 9:16 */
        #hidden-download-card {
            position: fixed;
            left: -9999px;
            top: 0;
            width: 540px; 
            height: 960px;
            z-index: -1;
            overflow: hidden;
        }

        /* TEXT DOWNLOAD*/
        .text-shadow-strong {
            text-shadow: 2px 2px 4px #000000;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gray-100 px-4 py-8">

    <div class="w-full max-w-[400px]">

        <!-- BAGIAN 1: INPUT NAMA-->
        <div id="start-page" class="bg-white rounded-2xl shadow-xl p-6 text-center fade-in">
            <h1 class="text-xl font-black text-gray-800 mb-1">SEKAWAN SIAPAKAH KAMU?</h1>
            <p class="text-gray-500 mb-6 text-xs">Yang bohong, jadi setannya!</p>
            
            <div class="mb-5 text-left">
                <label class="block text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Nama Kamu</label>
                <input type="text" id="username" placeholder="Ketik nama..." 
                    class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-pink-400 outline-none font-bold text-gray-700">
            </div>

            <button onclick="startQuiz()" 
                class="relative w-full py-2 rounded-xl font-bold text-white bg-[linear-gradient(90deg,#04024d_0%,#4e0979_50%,#4d0606_100%)] hover:shadow-[0_0_25px_rgba(236,72,153,0.35)]
         transition">
                Mulai
            </button>
        </div>


        <!-- BAGIAN 2: QUIZ -->
        <div id="quiz-page" class="bg-white rounded-2xl shadow-xl p-6 hidden fade-in">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-bold text-pink-500 bg-pink-50 px-3 py-1 rounded-full">
                    Pertanyaan <span id="current-q-num">1</span>/10
                </span>
                <div class="h-2 w-24 bg-gray-100 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-pink-500 to-yellow-500 transition-all" style="width: 10%"></div>
                </div>
            </div>

            <h2 id="question-text" class="text-sm font-bold text-gray-800 mb-5 leading-relaxed min-h-[72px] flex items-center">
                Loading...
            </h2>

            <div id="options-container" class="space-y-3">
            </div>
        </div>


        <!-- BAGIAN 3: RESULT -->
        <div id="result-page" class="hidden fade-in flex flex-col items-center w-full">
            
            <!-- CARD UTAMA (VERTIKAL / KE BAWAH) -->
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden w-full flex flex-col transition-all duration-500">
                
                <!-- 1. BAGIAN GAMBAR (ATAS) -->
                <div class="relative w-full h-[450px] overflow-hidden bg-gray-900">
                    
                    <!-- Layer A: Background Texture (Paling Belakang) -->
                    <img id="display-header-bg" src="" class="absolute inset-0 w-full h-full object-cover z-0 opacity-80" alt="Background Texture">
                    
                    <!-- Gradient halus supaya teks putih terbaca -->
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-0"></div>

                    <!-- Layer B: Label User (Paling Atas Header) -->
                    <div class="absolute top-8 left-0 w-full text-center z-30">
                         <div class="inline-block px-4 py-1">
                             <p class="text-white text-[10px] font-bold tracking-[0.2em] uppercase drop-shadow-md">
                                <span id="display-username" class="text-yellow-300">NAMA</span>, KAMU ADALAH
                            </p>
                        </div>
                    </div>
                    
                    <!-- Layer C: Teks Nama Tokoh (Di BELAKANG Foto) -->
                    <!-- Posisi text absolute di tengah, ukuran besar, warna PUTIH -->
                    <div class="absolute inset-0 flex items-start justify-center z-10 pointer-events-none pt-9 scale-90">
                        <h1 id="display-char-name" class="text-white text-[70px] sm:text-[80px] font-black uppercase tracking-tighter leading-none text-center drop-shadow-xl">
                            TOKOH
                        </h1>
                    </div>

                    <!-- Layer D: Foto Karakter (Di DEPAN Teks Tokoh) -->
                    <div class="absolute inset-0 z-20 flex items-end justify-center">
                        <!-- Ukuran foto dikecilkan jadi 85% -->
                        <img id="display-char-img" src="" class="h-[80%] object-contain drop-shadow-2xl transition-transform hover:scale-105 duration-500" alt="Karakter">
                    </div>

                </div>

                <!-- 2. BAGIAN DESKRIPSI (BAWAH) -->
                <div class="p-6 flex flex-col justify-center bg-white relative z-20">
                    
                    <p id="display-desc" class="text-sm leading-relaxed mb-5 text-gray-600 text-center font-medium">
                        Deskripsi karakter...
                    </p>
                    
                    <!-- Box Sifat -->
                    <div class="bg-blue-50 p-5 rounded-2xl text-left mb-5 border border-blue-100">
                        <h3 class="text-xs font-bold text-blue-800 mb-3 uppercase tracking-wide flex items-center gap-2">
                            SIFAT-SIFATMU
                        </h3>
                        <ul id="display-traits" class="text-sm text-gray-700 space-y-2 list-disc list-inside">
                            <!-- List sifat via JS -->
                        </ul>
                    </div>

                    <!-- Match / Mismatch -->
                    <div class="grid grid-cols-2 gap-3 text-xs font-bold text-center">
                        <div class="bg-green-100 text-green-800 p-3 rounded-xl">
                            <span class="block text-[10px] uppercase opacity-70 mb-1">Cocok:</span>
                            <span id="display-match" class="text-base">...</span>
                        </div>
                        <div class="bg-red-100 text-red-800 p-3 rounded-xl">
                            <span class="block text-[10px] uppercase opacity-70 mb-1">Musuh:</span>
                            <span id="display-mismatch" class="text-base">...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BUTTONS -->
            <div class="mt-6 w-full space-y-3">
                <button onclick="downloadResult()" class="w-full py-2 bg-gray-900 text-white font-bold rounded-xl shadow-lg hover:bg-black transition flex items-center justify-center gap-2">
                    <span class="text-lg"> Simpan Gambar
                </button>

                <button onclick="shareResult(event)"
                    class="w-full py-2 rounded-xl font-bold text-white
                bg-gradient-to-r from-[#12072a] via-[#190b2f] to-[#431e7e] hover:shadow-[0_0_25px_rgba(236,72,153,0.35)]transition">
                    Bagikan Hasil
                </button>

                <button onclick="restartQuiz()" class="w-full bg-white border border-gray-300 text-gray-700 font-bold py-3.5 rounded-xl hover:bg-gray-50 transition">
                    Ulangi
                </button>
                <button onclick="toggleDownloadPreview()" class="w-full bg-transparent text-gray-400 text-xs font-bold py-2 hover:text-gray-600">
                    (Debug) Lihat Desain Download
                </button>
            </div>
        </div>

    </div>

    <!-- ================= TEMPLATE DOWNLOAD RAHASIA (9:16) ================= -->
    <div id="hidden-download-card" class="bg-gray-900 relative">
        
        <!-- FULL BACKGROUND IMAGE -->
        <img id="dl-bg-img" src="" 
             class="absolute inset-0 w-full h-full object-cover z-0" 
             crossorigin="anonymous">

        <!-- Overlay Gelap Tipis (Opsional, hapus class bg-black/10 jika ingin full terang) -->
        <div class="absolute inset-0 bg-black/10 z-10"></div>

        <!-- TEKS NAMA (Tanpa Background Box) -->
        <!-- PENTING: Ubah class 'top-32' menjadi 'top-40' atau angka lain untuk mengatur tinggi/turunnya posisi teks -->
        <div class="absolute top-[36%] left-0 w-full z-20 px-8 text-center">
            
            <!-- Teks Nama Langsung (Tanpa box background) -->
            <p class="text-white text-l font-bold uppercase tracking-widest text-shadow-strong">
                <span id="dl-username" class="text-yellow-400">NAMA</span>, KAMU ADALAH...
            </p>
            
        </div>

        <!-- Footer "Sekawan vs Setan" SUDAH DIHAPUS -->
    </div>

    <!-- AUDIO -->
    <audio id="bgm" src="https://fibersky.id/wp-content/uploads/2026/02/babyshark.mp3" loop></audio>
    <img id="musicToggle" src="https://fibersky.id/wp-content/uploads/2026/02/image-M3Br5qPsOkXmks1G9QnEfn7KyHkgtO.png" 
         onclick="toggleMusic()" 
         class="fixed bottom-5 right-5 w-10 h-10 cursor-pointer z-[9999]">

    <script>
        // --- DATA KARAKTER LENGKAP ---
        const characters = {
            komang: {
                name: "Komang",
                desc: "Kamu tipe orang yang selalu mikirin perasaan orang lain duluan. Rendah hati, sabar, dan hampir nggak pernah bikin suasana panas.",
                traits: ["Perhatian", "People pleaser", "Rendah hati", "Sabar"],
                matches: "Johan",
                mismatches: "Yosef",
                // Gambar untuk Display Card (Layering)
                charImg: "http://www.filmsekawansetan.com/wp-content/uploads/2026/02/komang-scaled.png",
                headerBg: "http://www.filmsekawansetan.com/wp-content/uploads/2026/02/background.png",
                // Gambar untuk Download (Full Story)
                downloadBg: "http://www.filmsekawansetan.com/wp-content/uploads/2026/02/tst2.png"
            },
            feng: {
                name: "Feng",
                desc: "Percaya diri, tegas, dan punya aura pemimpin. Kamu tau apa yang kamu mau dengan prinsip yang kuat.",
                traits: ["Percaya diri", "Jiwa Pemimpin", "Tegas & Galak", "Berprinsip"],
                matches: "Yusuf",
                mismatches: "Johan",
                charImg: "https://api.dicebear.com/9.x/avataaars/svg?seed=Aneka&backgroundColor=transparent",
                headerBg: "https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=800&q=80",
                downloadBg: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&q=80"
            },
            yusuf: {
                name: "Yusuf",
                desc: "Anti ribet, realistis, dan suka ketenangan. Kalau bisa mudah kenapa harus dipersulit?",
                traits: ["Realistis", "Introvert", "Anti Ribet", "Suka Ngalah"],
                matches: "Feng",
                mismatches: "Yosef",
                charImg: "https://api.dicebear.com/9.x/avataaars/svg?seed=Brian&backgroundColor=transparent",
                headerBg: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800&q=80",
                downloadBg: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800&q=80"
            },
            yosef: {
                name: "Yosef",
                desc: "Nama tengahmu adalah 'Chaos'. Suka hal baru, nekat, dan selalu punya ide gila.",
                traits: ["Jahil Parah", "Extrovert", "Ide Gila", "Modal Nekat"],
                matches: "Feng",
                mismatches: "Komang",
                charImg: "https://api.dicebear.com/9.x/avataaars/svg?seed=Felix&backgroundColor=transparent",
                headerBg: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=800&q=80",
                downloadBg: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=800&q=80"
            },
            johan: {
                name: "Johan",
                desc: "Kamu penakut tapi tulus, lugu, dan berhati lembut. Fix anak bungsu tongkrongan.",
                traits: ["Ga enakan", "Penakut", "Tulus", "Polos"],
                matches: "Komang",
                mismatches: "Feng",
                charImg: "https://api.dicebear.com/9.x/avataaars/svg?seed=Trouble&backgroundColor=transparent",
                headerBg: "https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=800&q=80",
                downloadBg: "https://images.unsplash.com/photo-1488161628813-99c974c7904e?w=800&q=80"
            }
        };

        // --- PERTANYAAN ---
        const questions = [
            { q: "Pas lagi bokek parah, kamu..", options: [{ text: "Makan mie instan, air dibanyakin", points: ["komang", "johan", "yusuf"] }, { text: "Cari pinjaman / nekat makan dulu", points: ["feng", "yosef"] }] },
            { q: "Liat tumpukan baju kotor..", options: [{ text: "Langsung cuci", points: ["feng", "komang"] }, { text: "Tunggu habis stok", points: ["yusuf", "yosef", "johan"] }] },
            { q: "Teman kos ngumpul di ruang tengah..", options: [{ text: "Ikut nimbrung", points: ["yosef", "feng"] }, { text: "Nyapa bentar terus masuk kamar", points: ["yusuf", "komang", "johan"] }] },
            { q: "Keluar kamar sebentar..", options: [{ text: "Kunci pintu rapat", points: ["johan", "yusuf"] }, { text: "Biarin kebuka", points: ["yosef", "feng", "komang"] }] },
            { q: "Ibu Kos nagih uang sewa..", options: [{ text: "Ngumpet", points: ["johan", "yusuf", "komang"] }, { text: "Maju nego", points: ["feng", "yosef"] }] },
            { q: "Teman pinjam barang kesayangan..", options: [{ text: "Kasih aja", points: ["komang", "johan", "yosef"] }, { text: "Bilang lagi dipake", points: ["feng", "yusuf"] }] },
            { q: "Waktu luang enaknya..", options: [{ text: "Maraton film", points: ["johan", "yosef", "feng"] }, { text: "Scroll sosmed / baca berita", points: ["Yusuf", "Komang"] }] },
            { q: "Ada suara aneh di kamar mandi..", options: [{ text: "Lari keluar minta tolong", points: ["johan", "komang"] }, { text: "Cek bawa senter", points: ["feng", "yusuf", "yosef"] }] },
            { q: "Makanan di kulkas ilang..", options: [{ text: "Ikhlasin", points: ["komang", "yusuf", "johan"] }, { text: "Investigasi siapa pelakunya", points: ["feng", "yosef"] }] },
            { q: "Diusir dari kosan..", options: [{ text: "Numpang temen diem-diem", points: ["komang", "johan", "yusuf"] }, { text: "Cari cara dapet duit instan", points: ["yosef", "feng"] }] }
        ];

        let currentQuestionIndex = 0;
        let scores = { komang: 0, feng: 0, yusuf: 0, yosef: 0, johan: 0 };
        let userName = "";

        // --- FUNGSI QUIZ ---
        function startQuiz() {
            const nameInput = document.getElementById('username');
            if (!nameInput.value.trim()) { alert("Isi nama dulu dong!"); return; }
            userName = nameInput.value.trim();
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
            document.getElementById('question-text').innerText = q.q;

            const container = document.getElementById('options-container');
            container.innerHTML = "";
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-gray-100 bg-gray-50 hover:bg-pink-50 hover:border-pink-300 transition flex items-center gap-3 group";
                btn.innerHTML = `<div class="bg-white border text-gray-400 font-bold w-8 h-8 flex items-center justify-center rounded-lg group-hover:bg-pink-400 group-hover:text-white transition shrink-0 text-sm">${String.fromCharCode(65 + idx)}</div><span class="text-gray-700 font-medium text-xs group-hover:text-pink-600">${opt.text}</span>`;
                btn.onclick = () => handleAnswer(opt.points);
                container.appendChild(btn);
            });
        }

        function handleAnswer(points) {
            points.forEach(char => scores[char] = (scores[char] || 0) + 1);
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) loadQuestion();
            else showResult();
        }

        function showResult() {
            let maxScore = -1, resultChar = "komang";
            for (const [char, score] of Object.entries(scores)) {
                if (score > maxScore) { maxScore = score; resultChar = char; }
            }
            const data = characters[resultChar];

            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');

            // 1. UPDATE TAMPILAN LAYAR (UI CARD)
            document.getElementById('display-username').innerText = userName;
            document.getElementById('display-char-name').innerText = data.name;
            document.getElementById('display-desc').innerText = data.desc;
            document.getElementById('display-match').innerText = data.matches;
            document.getElementById('display-mismatch').innerText = data.mismatches;
            
            // Set 2 Gambar di Header Card:
            document.getElementById('display-char-img').src = data.charImg;  // Foto Orang
            document.getElementById('display-header-bg').src = data.headerBg; // Foto Background Texture
            
            // List Sifat
            const traitsList = document.getElementById('display-traits');
            traitsList.innerHTML = data.traits.map(trait => `<li>${trait}</li>`).join('');

            // 2. UPDATE KARTU DOWNLOAD (HIDDEN)
            document.getElementById('dl-username').innerText = userName;
            // Hapus teks nama karakter untuk download, pakai gambar story full
            document.getElementById('dl-bg-img').src = data.downloadBg;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            scores = { komang: 0, feng: 0, yusuf: 0, yosef: 0, johan: 0 };
            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('start-page').classList.remove('hidden');
            document.getElementById('username').value = "";
        }

        // --- MUSIC TOGGLE ---
        const audio = document.getElementById('bgm');
        const btn = document.getElementById('musicToggle');
        function toggleMusic() {
            if (audio.paused) {
                audio.volume = 0.3;
                audio.play();
                btn.src = 'https://fibersky.id/wp-content/uploads/2026/02/image-M3Br5qPsOkXmks1G9QnEfn7KyHkgtO.png';
            } else {
                audio.pause();
                btn.src = 'https://fibersky.id/wp-content/uploads/2026/02/pngimg.com-sound_PNG17.png'; 
            }
        }

        // --- DOWNLOAD & SHARE ---
        function downloadResult() {
            const el = document.getElementById("hidden-download-card");
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;

            btn.innerHTML = "⏳ Memproses...";
            btn.disabled = true;

            setTimeout(() => {
                html2canvas(el, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: null
                }).then(canvas => {
                    const link = document.createElement("a");
                    link.download = `Sekawan-Vs-Setan-${userName}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }).catch(err => {
                    console.error("Gagal render:", err);
                    alert("Gagal simpan gambar. Pastikan server gambar support CORS.");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
            }, 1000);
        }

        async function shareResult(event) {
            const btn = event?.currentTarget || document.activeElement;
            const originalText = btn.innerHTML;
            btn.innerHTML = "Memproses...";
            btn.disabled = true;

            const el = document.getElementById("hidden-download-card");

            try {
                // 1. Render kartu download jadi canvas
                const canvas = await html2canvas(el, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: null
                });

                // 2. Canvas → Blob → File
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert("Gagal memproses gambar.");
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        return;
                    }

                    const file = new File(
                        [blob],
                        `Sekawan-Vs-Setan-${userName}.png`,
                        { type: "image/png" }
                    );

                    const shareData = {
                        files: [file],
                        title: "Hasil Kuis Sekawan vs Setan",
                        text: `Aku dapet ${document.getElementById('display-char-name').innerText}! Kamu siapa? Cek karaktermu di filmsekawansetan.com`
                    };

                    // 3. Native Share (Mobile: WA, IG, Telegram, dll)
                    if (navigator.canShare && navigator.canShare(shareData)) {
                        try {
                            await navigator.share(shareData);
                        } catch (err) {
                            console.log("Share dibatalkan:", err);
                        }
                    } else {
                        // 4. Fallback Desktop (download manual)
                        alert("Browser ini belum support share gambar. Gambar akan diunduh ya!");
                        const link = document.createElement("a");
                        link.download = `Sekawan-Vs-Setan-${userName}.png`;
                        link.href = canvas.toDataURL("image/png");
                        link.click();
                    }

                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, "image/png");

            } catch (err) {
                console.error(err);
                alert("Gagal membagikan hasil. Coba lagi.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        let isPreviewing = false;
        function toggleDownloadPreview() {
            const card = document.getElementById("hidden-download-card");
            if (isPreviewing) {
                card.style.position = "fixed";
                card.style.left = "-9999px";
                card.style.zIndex = "-1";
                card.style.transform = "";
                document.body.style.overflow = "";
                isPreviewing = false;
            } else {
                card.style.position = "relative";
                card.style.left = "0";
                card.style.zIndex = "9999";
                card.style.transform = "scale(0.5)";
                card.style.transformOrigin = "top center";
                card.style.margin = "20px auto";
                document.body.style.overflow = "auto";
                card.scrollIntoView();
                isPreviewing = true;
            }
        }
    </script>
</body>
</html>
