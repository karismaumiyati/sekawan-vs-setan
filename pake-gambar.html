<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kepribadian: Siapa Kamu?</title>
    <!-- Menggunakan Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas untuk simpan gambar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
        }
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-4 px-4 bg-gray-100">

    <div class="w-full max-w-md"> 
        
        <!-- HALAMAN 1: INPUT NAMA -->
        <div id="start-page" class="bg-white rounded-2xl shadow-xl p-8 text-center fade-in">
            <h1 class="text-2xl font-black text-gray-800 mb-2">SEKAWAN SIAPAKAH KAMU?</h1>
            <p class="text-gray-500 mb-8 text-sm">Jawab jujur, jangan bohong ya!</p>
            
            <div class="mb-6 text-left">
                <label class="block text-xs font-bold uppercase text-gray-400 mb-2 tracking-wider">Nama Kamu</label>
                <input type="text" id="username" placeholder="Ketik nama..." 
                    class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-pink-400 outline-none font-bold text-gray-700">
            </div>

            <button onclick="startQuiz()" 
                class="w-full bg-gradient-to-r from-pink-500 to-yellow-500 text-white font-black py-4 rounded-xl shadow-lg uppercase tracking-wider transform transition hover:scale-[1.02]">
                Mulai
            </button>
        </div>

        <!-- HALAMAN 2: PERTANYAAN -->
        <div id="quiz-page" class="bg-white rounded-2xl shadow-xl p-8 hidden fade-in">
            <div class="flex justify-between items-center mb-6">
                <span class="text-xs font-bold text-pink-500 bg-pink-50 px-3 py-1 rounded-full">Pertanyaan <span id="current-q-num">1</span>/12</span>
                <div class="h-2 w-24 bg-gray-100 rounded-full">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-pink-500 to-blue-500 rounded-full transition-all duration-300" style="width: 8%"></div>
                </div>
            </div>

            <h2 id="question-text" class="text-lg font-bold text-gray-800 mb-6 leading-relaxed">Loading...</h2>

            <div id="options-container" class="space-y-3">
                <!-- Options injected JS -->
            </div>
        </div>

        <!-- HALAMAN 3: HASIL (Layout Mirip Referensi) -->
        <div id="result-page" class="hidden fade-in flex flex-col items-center">
            
            <!-- KARTU HASIL (Ini yang akan di-screenshot) -->
            <!-- Ukuran fixed width agar proporsi konsisten saat di-save -->
            <div id="result-card" class="bg-white overflow-hidden relative shadow-2xl" style="width: 375px;">
                
                <!-- 1. HEADER GRADIENT (Pink - Yellow) -->
                <div class="relative bg-gradient-to-b from-[#FFA7D1] to-[#E3E856] h-[320px] pt-8 flex flex-col items-center text-center overflow-hidden">
                    
                    <!-- Nama User -->
                    <p class="relative z-10 text-white text-[10px] font-black tracking-[0.2em] uppercase drop-shadow-sm mb-1">
                        <span id="result-username">NAMA</span>, KAMU ADALAH
                    </p>
                    
                    <!-- Container untuk Teks Besar & Gambar -->
                    <div class="relative w-full h-full flex justify-center items-end pb-0">
                        <!-- Teks Karakter Besar (Di belakang gambar) -->
                        <h1 id="result-char-name" class="absolute top-0 -translate-y-4 w-full text-center text-white text-[90px] font-black leading-none tracking-tighter uppercase drop-shadow-md z-0 opacity-95">
                            TOKOH
                        </h1>

                        <!-- Gambar Karakter (Di depan teks) -->
                        <img id="result-img" src="" 
                             class="relative z-10 h-[250px] object-contain drop-shadow-xl transform translate-y-2">
                    </div>
                </div>

                <!-- 2. BODY SECTION (Blue) -->
                <div class="bg-[#72ACE0] p-6 text-white grid grid-cols-2 gap-4">
                    <!-- Kolom Kiri: Deskripsi -->
                    <div class="col-span-1 border-r border-white/30 pr-2">
                        <p id="result-desc" class="text-[10px] leading-relaxed font-medium">
                            Deskripsi karakter akan muncul di sini...
                        </p>
                    </div>
                    
                    <!-- Kolom Kanan: Sifat -->
                    <div class="col-span-1 pl-1">
                        <h3 class="text-sm font-bold mb-2">Sifat-sifatmu:</h3>
                        <ul id="result-traits" class="list-disc list-outside ml-3 text-[10px] leading-relaxed font-medium">
                            <!-- List injected here -->
                        </ul>
                    </div>
                </div>

                <!-- 3. FOOTER BARS -->
                <!-- Paling Cocok (Orange) -->
                <div class="bg-[#EA9E2E] py-3 px-6 flex justify-center items-center gap-2">
                    <span class="text-white text-[10px] font-medium">Paling Cocok Sama:</span>
                    <span id="match-text" class="text-white text-lg font-black uppercase tracking-wide">...</span>
                </div>

                <!-- Kurang Cocok (Red) -->
                <div class="bg-[#D94632] py-3 px-6 flex justify-center items-center gap-2">
                    <span class="text-white text-[10px] font-medium">Kurang Cocok Sama:</span>
                    <span id="mismatch-text" class="text-white text-lg font-black uppercase tracking-wide">...</span>
                </div>

                <!-- Footer (Green) -->
                <div class="bg-[#599E52] py-2 text-center">
                    <p class="text-[8px] text-white font-bold tracking-widest uppercase">
                        SEKAWAN VS SETAN
                    </p>
                </div>

            </div>

            <!-- Tombol Aksi -->
            <div class="mt-6 w-full max-w-[375px] space-y-3 pb-8">
                <button onclick="downloadResult()" class="w-full bg-gray-900 text-white font-bold py-3 rounded-lg shadow-lg flex justify-center items-center gap-2 hover:bg-black transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Simpan Gambar
                </button>
                <div class="flex gap-2">
                    <button onclick="shareResult()" class="flex-1 bg-blue-100 text-blue-700 font-bold py-3 rounded-lg hover:bg-blue-200 transition">Bagikan</button>
                    <button onclick="restartQuiz()" class="flex-1 bg-white border border-gray-300 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-50 transition">Ulangi</button>
                </div>
            </div>

        </div>

    </div>

    <!-- AUDIO -->
    <audio
        id="bgm"
        src="https://fibersky.id/wp-content/uploads/2026/02/babyshark.mp3"
        loop
    ></audio>

    <!-- MUSIC TOGGLE -->
    <img
        id="musicToggle"
        src="https://fibersky.id/wp-content/uploads/2026/02/pngimg.com-sound_PNG7.png"
        alt="Music Toggle"
        onclick="toggleMusic()"
        style="
            position:fixed;
            bottom:150px;
            right:20px;
            width:60px;
            height:60px;
            cursor:pointer;
            z-index:9999;
    "
    />

    <script>
        const audio = document.getElementById('bgm');
        const btn = document.getElementById('musicToggle');

        function toggleMusic() {
            if (audio.paused) {
            audio.volume = 0.3;
            audio.play();
            audio.muted = false;
            btn.src = 'https://fibersky.id/wp-content/uploads/2026/02/image-M3Br5qPsOkXmks1G9QnEfn7KyHkgtO.png';
            } else {
            audio.pause();
            btn.src = 'https://fibersky.id/wp-content/uploads/2026/02/pngimg.com-sound_PNG7.png'; 
            }
        }


        // --- DATA KARAKTER ---
        const characters = {
            adi: {
                name: "Adi",
                desc: "Hidup tanpa keceriaanmu tuh bagaikan sayur tanpa garam. Kamu orangnya polos, ceplas-ceplos, tapi justru itu yang bikin ngangenin.",
                traits: [
                    "Natural comedian, gak suka serius",
                    "Ramah ke semua orang",
                    "Hangat dan penyayang",
                    "Suka gagal fokus"
                ],
                matches: "Semua Orang",
                mismatches: "Iqbal",
                imgSeed: "Felix" 
            },
            iqbal: {
                name: "Iqbal",
                desc: "Kamu itu definisi 'Misterius tapi Sultan'. Suka ketenangan, mageran parah, tapi kalau urusan duit atau traktir kadang bisa diandalkan.",
                traits: [
                    "Introvert sejati",
                    "Kaum rebahan elite",
                    "Mageran kalau diajak main",
                    "Anti drama club"
                ],
                matches: "Uus",
                mismatches: "Onar",
                imgSeed: "Aneka"
            },
            uus: {
                name: "Uus",
                desc: "Manusia paling lempeng. Hidupnya tertata rapi sesuai SOP. Kamu adalah penyeimbang kalau teman-temanmu mulai aneh-aneh.",
                traits: [
                    "Rajin pangkal pandai",
                    "Hidup lurus no neko-neko",
                    "Logis dan realistis",
                    "Sangat taat aturan"
                ],
                matches: "Eka",
                mismatches: "Onar",
                imgSeed: "Brian"
            },
            eka: {
                name: "Eka",
                desc: "Tipe pekerja keras yang 'Talk less do more'. Kelihatan cuek, tapi sebenarnya peduli. Cuma butuh kopi dan rokok biar damai.",
                traits: [
                    "Workaholic sejati",
                    "To the point",
                    "Setia kawan banget",
                    "Fokus pada tujuan"
                ],
                matches: "Uus",
                mismatches: "Iqbal",
                imgSeed: "Christopher"
            },
            onar: {
                name: "Onar",
                desc: "Nama tengahmu adalah 'Keributan'. Kamu suka hal baru, nekat, dan selalu punya ide gila yang bikin tongkrongan jadi pecah.",
                traits: [
                    "Pecicilan gak bisa diam",
                    "Suka tantangan",
                    "Random banget orangnya",
                    "Moodbooster (kadang)"
                ],
                matches: "Adi",
                mismatches: "Uus",
                imgSeed: "Trouble"
            }
        };

        // --- DATA PERTANYAAN ---
        const questions = [
            {
                q: "Apa yang biasanya kamu lakukan saat akhir pekan?",
                options: [
                    { text: "Nongkrong bareng banyak orang sambil bercanda.", points: ["adi", "onar"] },
                    { text: "Di rumah saja, main gadget atau tidur.", points: ["iqbal"] },
                    { text: "Melakukan hobi yang produktif atau olahraga.", points: ["uus", "eka"] }
                ]
            },
            {
                q: "Bagaimana caramu menghadapi pekerjaan atau tugas sekolah?",
                options: [
                    { text: "Dikerjakan sambil diselingi bercanda.", points: ["adi"] },
                    { text: "Nanti saja kalau sudah mepet deadline.", points: ["iqbal", "onar"] },
                    { text: "Langsung dikerjakan sesuai jadwal supaya tenang.", points: ["uus", "eka"] }
                ]
            },
            {
                q: "Temanmu sedang kesulitan uang, apa yang kamu lakukan?",
                options: [
                    { text: "Langsung bantu sebisa mungkin karena peduli.", points: ["adi"] },
                    { text: "Pura-pura tidak tahu atau bilang sedang tidak ada uang.", points: ["iqbal"] },
                    { text: "Bantu sewajarnya saja kalau memang sudah kenal lama.", points: ["uus", "eka"] }
                ]
            },
            {
                q: "Apa hal yang paling tidak bisa kamu tinggalkan dalam sehari?",
                options: [
                    { text: "Ngobrol atau berinteraksi dengan orang lain.", points: ["adi"] },
                    { text: "Menikmati waktu sendirian tanpa gangguan.", points: ["iqbal"] },
                    { text: "Kebiasaan tertentu (seperti kopi/rokok).", points: ["eka", "uus"] }
                ]
            },
            {
                q: "Bagaimana sikapmu saat masuk ke lingkungan baru?",
                options: [
                    { text: "Langsung menyapa orang-orang dan gampang akrab.", points: ["adi", "onar"] },
                    { text: "Diam saja di pojokan sampai ada yang mengajak bicara.", points: ["iqbal"] },
                    { text: "Bersikap sopan dan mengikuti alur yang ada saja.", points: ["uus"] }
                ]
            },
            {
                q: "Apa pendapatmu tentang mencoba hal yang ekstrem?",
                options: [
                    { text: "Seru kalau dilakukan bareng teman-teman.", points: ["adi"] },
                    { text: "Malas, lebih baik di zona nyaman yang sudah pasti.", points: ["iqbal", "uus"] },
                    { text: "Sangat suka! Hidup harus penuh gebrakan.", points: ["onar"] }
                ]
            },
            {
                q: "Jika ada peraturan di kantor atau sekolah...",
                options: [
                    { text: "Mengikuti saja sambil sesekali bercanda.", points: ["adi"] },
                    { text: "Sering melanggar diam-diam kalau tidak menguntungkan.", points: ["onar", "iqbal"] },
                    { text: "Taat sepenuhnya, hidup harus lurus-lurus saja.", points: ["uus", "eka"] }
                ]
            },
            {
                q: "Bagaimana caramu mengelola keuangan?",
                options: [
                    { text: "Sering habis untuk traktir atau jajan bareng teman.", points: ["adi"] },
                    { text: "Disimpan rapat-rapat, sangat perhitungan.", points: ["iqbal"] },
                    { text: "Alokasi untuk kebutuhan pokok dan tabungan.", points: ["uus", "eka"] }
                ]
            },
            {
                q: "Apa yang kamu lakukan jika suasana sepi?",
                options: [
                    { text: "Melempar jokes receh supaya suasana pecah.", points: ["adi"] },
                    { text: "Menikmati kesunyian itu sendirian.", points: ["iqbal", "eka"] },
                    { text: "Iseng melakukan sesuatu yang bikin kaget.", points: ["onar"] }
                ]
            },
            {
                q: "Deskripsi diri yang paling cocok untukmu...",
                options: [
                    { text: "Perhatian dan sayang dengan lingkaran pertemanan.", points: ["adi"] },
                    { text: "Pekerja keras tapi punya sisi tak bisa diganggu.", points: ["eka"] },
                    { text: "Orangnya normal-normal saja, tidak suka neko-neko.", points: ["uus"] }
                ]
            },
            {
                q: "Bagaimana caramu memandang sebuah kesuksesan?",
                options: [
                    { text: "Sukses itu kalau bisa bermanfaat buat orang lain.", points: ["adi"] },
                    { text: "Sukses itu punya banyak harta dinikmati sendiri.", points: ["iqbal"] },
                    { text: "Sukses itu hasil dari kerja keras yang konsisten.", points: ["eka", "uus"] }
                ]
            },
            {
                q: "Apa reaksi orang saat melihat tingkah lakumu?",
                options: [
                    { text: "\"Orangnya asik banget dan ramah ya!\"", points: ["adi"] },
                    { text: "\"Kadang bikin kesal karena aneh-aneh.\"", points: ["onar", "iqbal"] },
                    { text: "\"Orangnya rajin dan hidupnya tertata.\"", points: ["uus", "eka"] }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let scores = { adi: 0, iqbal: 0, uus: 0, eka: 0, onar: 0 };
        let userName = "";

        function startQuiz() {
            const nameInput = document.getElementById('username');
            if (nameInput.value.trim() === "") {
                alert("Isi nama dulu dong!");
                return;
            }
            userName = nameInput.value.trim();
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
            document.getElementById('question-text').innerText = q.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = "";

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-gray-100 bg-gray-50 hover:bg-pink-50 hover:border-pink-300 transition duration-200 flex items-center gap-3 group";
                btn.innerHTML = `
                    <div class="bg-white border text-gray-400 font-bold w-8 h-8 flex items-center justify-center rounded-lg group-hover:bg-pink-400 group-hover:text-white transition shrink-0 text-sm">
                        ${String.fromCharCode(65 + index)}
                    </div>
                    <span class="text-gray-700 font-medium text-xs group-hover:text-pink-600">${opt.text}</span>
                `;
                btn.onclick = () => handleAnswer(opt.points);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(pointsArr) {
            pointsArr.forEach(char => scores[char] = (scores[char] || 0) + 1);
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) loadQuestion();
            else showResult();
        }

        function showResult() {
            let maxScore = -1, resultChar = "adi";
            for (const [char, score] of Object.entries(scores)) {
                if (score > maxScore) { maxScore = score; resultChar = char; }
            }

            const data = characters[resultChar];
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');

            document.getElementById('result-username').innerText = userName;
            document.getElementById('result-char-name').innerText = data.name;
            document.getElementById('result-desc').innerText = data.desc;
            document.getElementById('match-text').innerText = data.matches;
            document.getElementById('mismatch-text').innerText = data.mismatches;
            
            // Generate list sifat
            const list = document.getElementById('result-traits');
            list.innerHTML = data.traits.map(t => `<li class="mb-1">${t}</li>`).join('');

            // Avatar Image
            document.getElementById('result-img').src = `https://api.dicebear.com/9.x/avataaars/svg?seed=${data.imgSeed}&backgroundColor=transparent`;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            scores = { adi: 0, iqbal: 0, uus: 0, eka: 0, onar: 0 };
            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('start-page').classList.remove('hidden');
            document.getElementById('username').value = "";
        }

        function shareResult() {
            const char = document.getElementById('result-char-name').innerText;
            if (navigator.share) {
                navigator.share({ title: 'Kuis Karakter', text: `Aku dapet ${char}! Cek punyamu:`, url: window.location.href });
            } else alert("Link disalin!");
        }

        function downloadResult() {
            const el = document.getElementById("result-card");
            const btn = event.currentTarget;
            btn.innerText = "Memproses...";
            
            // Tunggu sebentar agar gambar avatar terload sempurna (walau SVG)
            setTimeout(() => {
                html2canvas(el, { 
                    scale: 3, 
                    useCORS: true,
                    backgroundColor: null 
                }).then(canvas => {
                    const link = document.createElement("a");
                    link.download = `Hasil-Kuis-${userName}.png`;
                    link.href = canvas.toDataURL("image/png");
                    link.click();
                    btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Simpan Gambar`;
                });
            }, 500);
        }
    </script>
</body>
</html>
